<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d97757" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Xoay Key Groq</title>
    <style>
      body { margin: 0; background: #faf9f5; }
      @media (prefers-color-scheme: dark) { body { background: #1f1e1d; } }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; }
      .splash img { width: 84px; height: 84px; border-radius: 20px; animation: sp 1.6s ease-in-out infinite; }
      @keyframes sp { 50% { transform: scale(.88) rotate(30deg); opacity: .7; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash"><img src="/logo.svg" alt="Xoay Key" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
